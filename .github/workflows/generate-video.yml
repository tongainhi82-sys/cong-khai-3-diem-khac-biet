name: Generate video from private repo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spot-difference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: private-source

    env:
      PRIVATE_REPO: "colfleshjadein2404997-oss/TIM-3-MOI"
      PRIVATE_REF: "main"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      DIFFERENCE_FORGE_SEED: "${{ github.run_id }}-${{ github.run_attempt }}"

      # ===== EDIT THESE VALUES DIRECTLY IN THIS PUBLIC YML =====
      # Starting number for the run sequence only. It does NOT control prompts.
      # Example: SEQ_BASE_RUN="10" means the first successful run is recorded as run 10,
      # then subsequent successful runs advance to 11, 12, ... while this base stays unchanged.
      SEQ_BASE_RUN: "3"
      # First title index. Titles then advance in order after successful runs.
      # Titles are intentionally NOT de-duplicated.
      TITLE_START: "1"

      # Prompts have no manual selector: they always advance automatically to the next
      # unused prompt in extra-prompts.txt and remain de-duplicated via prompt-usage.txt.
      DF_GAME_COUNT: "10"
      CPU_DREAMSHAPER_STEPS: "8"
      YT_PRIVACY_STATUS: "private"  # private | public | unlisted

      DF_COUNTDOWN_SECONDS: "90"
      DF_REVEAL_SECONDS: "10"
      DF_INTRO_SECONDS: "48"
      DF_TRANSITION_SECONDS: "4.2"
      DF_OUTRO_SECONDS: "38"
      DF_OUTPUT_DIR: "dist"
      DF_VIDEO_FILENAME: "spot-the-difference.mp4"
      DF_WIDTH: "1920"
      DF_HEIGHT: "1080"
      DF_FPS: "24"

      # Public repo checkout containing the editable catalogs, description and usage history.
      RUNNER_CONTROL_DIR: "${{ github.workspace }}/runner-control"

      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CF_STEPS: "8"
      CF_REQUEST_TIMEOUT: "180"
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_MODEL: "flux"
      AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
      AIHORDE_TIMEOUT: "600"
      CF_STYLE_SUFFIX: >-
        bold Japanese cel illustration, deeply saturated colors, thick dark clean outlines,
        crisp hard edges, flat purposeful shading, high local contrast, no pastel haze,
        no blur, no text, no logo, no watermark, no split screen, no collage

      MASK_MIN_AREA_RATIO: "0.012"
      MASK_MAX_AREA_RATIO: "0.065"
      FASTSAM_MODEL: "FastSAM-x.pt"
      FASTSAM_IMGSZ: "1024"
      FASTSAM_CONF: "0.4"
      SAM2_MODEL: "facebook/sam2.1-hiera-small"
      SAM2_REFINE_LIMIT: "8"
      SAM2_MIN_FASTSAM_IOU: "0.25"
      SAM2_MIN_MODEL_IOU: "0.45"
      SAM2_MIN_BOX_CONTAINMENT: "0.78"
      SAM2_UNLOAD_AFTER_REFINE: "true"

      MASK_REFINE_KERNEL: "3"
      MASK_REFINE_ERODE: "1"
      MASK_MAX_HOLE_RATIO: "0.035"
      SINGLE_OBJECT_ERODE_ITERS: "2"
      SINGLE_OBJECT_MIN_ISLAND_AREA_RATIO: "0.08"
      SINGLE_OBJECT_MIN_DOMINANT_ISLAND: "0.92"
      SINGLE_OBJECT_MIN_RAW_DOMINANT: "0.90"
      OBJECT_FILTER_MIN_AREA_RATIO: "0.006"
      OBJECT_FILTER_MAX_AREA_RATIO: "0.075"
      OBJECT_FILTER_MIN_FILL: "0.18"
      OBJECT_FILTER_MIN_SOLIDITY: "0.50"
      OBJECT_FILTER_MIN_COMPACTNESS: "0.040"
      OBJECT_FILTER_MIN_EDGE: "0.0"
      OBJECT_FILTER_MAX_ASPECT: "4.5"
      MIN_ISOLATED_CANDIDATES: "3"
      SCENE_REGEN_RETRIES: "3"

      GROUNDING_DINO_MODEL: "IDEA-Research/grounding-dino-tiny"
      GROUNDING_DINO_CPU_MODEL: "IDEA-Research/grounding-dino-tiny"
      GROUNDING_DINO_GPU_MODEL: "IDEA-Research/grounding-dino-tiny"
      GROUNDING_DINO_THRESHOLD: "0.22"
      GROUNDING_PRIMARY_THRESHOLD: "0.22"
      GROUNDING_RETRY_THRESHOLD: "0.17"
      GROUNDING_TARGET_COUNT: "3"
      GROUNDING_PRIMARY_LABEL_LIMIT: "16"
      GROUNDING_RETRY_LABEL_LIMIT: "24"
      GROUNDING_MIN_MASK_OVERLAP: "0.18"
      GROUNDING_UNLOAD_AFTER_SCENE: "true"
      CENTER_EXCLUSION_X: "0.12"
      CENTER_EXCLUSION_Y: "0.13"
      MAX_SELECTABLE_OBJECT_AREA: "0.055"
      TARGET_OBJECT_AREA: "0.024"
      MIN_DIFFERENCE_DISTANCE: "0.23"
      SCENE_FUSED_MIN_SIGLIP: "0.010"
      SCENE_FUSED_MIN_GROUNDING: "0.20"

      SIGLIP2_CLASSIFIER_MODEL: "google/siglip2-base-patch16-512"
      SIGLIP_BATCH_SIZE: "2"
      SIGLIP_MIN_SCORE: "0.055"
      SIGLIP_MIN_MARGIN: "0.004"
      SIGLIP_REJECT_MARGIN: "0.010"
      SIGLIP_SEMANTIC_MIN_RETAIN: "0.18"
      FLORENCE_FALLBACK_ENABLED: "true"
      FLORENCE_BASE_FT_MODEL: "florence-community/Florence-2-base-ft"
      FLORENCE_LARGE_FT_MODEL: "florence-community/Florence-2-large-ft"
      FLORENCE_LARGE_MIN_RAM_GB: "10"
      FLORENCE_UNLOAD_AFTER_CLASSIFY: "true"
      FLORENCE_MAX_FALLBACKS: "8"
      SEMANTIC_TARGET_CANDIDATES: "8"
      CLIP_CLASSIFY_LIMIT: "8"
      SEMANTIC_TOP_K: "5"
      SEMANTIC_TOP1_REJECT_CEILING: "0.30"
      SEMANTIC_TOP1_REJECT_GAP: "0.10"
      SEMANTIC_FALLBACK_TOPK: "2"
      STRUCTURE_MIN_EDGE_RETAIN: "0.40"

      MIN_EDIT_COLOR_DISTANCE: "95.0"
      MIN_CLEAR_CHANGED_RATIO: "0.25"
      MIN_CHANGE_COMPONENT_PURITY: "0.70"
      MIN_CHANGED_PIXEL_DELTA: "28.0"
      MIN_STRONG_CHANGE_RATIO: "0.15"

      DIFFUSERS_BACKEND: "auto"
      FLUX_FILL_MODEL: "black-forest-labs/FLUX.1-Fill-dev"
      CPU_INPAINT_MODEL: "Lykon/dreamshaper-8-inpainting"
      CPU_INPAINT_FALLBACK_MODEL: "sd2-community/stable-diffusion-2-inpainting"
      SDXL_INPAINT_MODEL: "diffusers/stable-diffusion-xl-1.0-inpainting-0.1"
      SD_INPAINT_MODEL: "sd2-community/stable-diffusion-2-inpainting"
      INPAINT_SIZE: "320"
      INPAINT_STEPS: "10"
      CPU_DREAMSHAPER_SIZE: "320"
      INPAINT_RETRIES: "2"
      CPU_INPAINT_RETRIES: "1"
      INPAINT_STRENGTH: "0.72"
      MAX_INPAINT_CANDIDATES: "12"

      CPU_PREFILTER_MIN_INTERIOR_RATIO: "0.18"
      CPU_PREFILTER_MIN_FILL: "0.20"
      CPU_PREFILTER_MIN_RETAINED_MASK: "0.62"
      CPU_PREFILTER_MIN_BBOX_SIDE: "28"
      CPU_PREFILTER_POOL_LIMIT: "18"
      CPU_PREFILTER_STRUCTURAL_MIN_SCORE: "5.2"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

      YT_UPLOAD_ENABLED: "true"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Checkout public control repo
        uses: actions/checkout@v4
        with:
          path: runner-control
          fetch-depth: 0

      - name: Check private checkout token
        working-directory: .
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "::error::Add the PRIVATE_REPO_TOKEN Actions secret to this public repository."
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Use public YouTube description
        working-directory: .
        run: cp runner-control/mota.txt private-source/mota.txt

      - name: Patch final-scene guaranteed fallback
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          path = Path("quality_diversity_runner.py")
          text = path.read_text(encoding="utf-8")

          old_triplet = '''def _best_grouped_triplet(candidates: list[dict[str, object]], size: tuple[int, int]):
              diag = math.hypot(*size)
              need = diag * scene.MIN_SPREAD
          '''
          new_triplet = '''def _best_grouped_triplet(
              candidates: list[dict[str, object]],
              size: tuple[int, int],
              min_spread: float,
          ):
              diag = math.hypot(*size)
              need = diag * min_spread
          '''
          if old_triplet not in text:
              raise SystemExit("Guaranteed fallback patch failed: triplet selector signature changed")
          text = text.replace(old_triplet, new_triplet, 1)

          old_error = '''        raise RuntimeError(
                      f"No color/pattern/structural triplet satisfies {scene.MIN_SPREAD:.2f} image-diagonal spread"
                  )
          '''
          new_error = '''        raise RuntimeError(
                      f"No color/pattern/structural triplet satisfies {min_spread:.2f} image-diagonal spread"
                  )
          '''
          if old_error not in text:
              raise SystemExit("Guaranteed fallback patch failed: triplet error block changed")
          text = text.replace(old_error, new_error, 1)

          old_create = '''    candidates = detect_group_ready_candidates(base)
              preferred = _best_grouped_triplet(candidates, base.size)
              preferred_keys = [_key(x) for x in preferred]
              edited = base.copy()
              regions: list[dict[str, object]] = []
              metadata: list[dict[str, object]] = []
              accepted: list[dict[str, object]] = []
              used: set[tuple[int, int, int, int]] = set()
              diag = math.hypot(*base.size)
              need = diag * scene.MIN_SPREAD
              attempted = 0
          '''
          new_create = '''    candidates = detect_group_ready_candidates(base)
              provider_meta = getattr(strict, "_LAST_PROVIDER_META", None) or {}
              regen_attempt = int(provider_meta.get("scene_regeneration_attempt", 0) or 0)
              final_regen = strict.SCENE_REGEN_RETRIES > 0 and regen_attempt >= strict.SCENE_REGEN_RETRIES

              spread_levels = [scene.MIN_SPREAD]
              if final_regen:
                  for fallback_spread in (0.21, 0.19):
                      if fallback_spread < spread_levels[-1]:
                          spread_levels.append(fallback_spread)

              last_spread_error = None
              for min_spread in spread_levels:
                  try:
                      preferred = _best_grouped_triplet(candidates, base.size, min_spread)
                  except RuntimeError as exc:
                      last_spread_error = exc
                      if min_spread != spread_levels[-1]:
                          print(
                              f"[diversity] final-scene spread {min_spread:.2f} unavailable; "
                              f"trying {spread_levels[spread_levels.index(min_spread) + 1]:.2f}"
                          )
                      continue
                  if min_spread < scene.MIN_SPREAD:
                      print(
                          f"[diversity] final-scene spread fallback active: "
                          f"{scene.MIN_SPREAD:.2f} -> {min_spread:.2f}"
                      )
                  break
              else:
                  raise last_spread_error or RuntimeError("No valid grouped triplet")

              preferred_keys = [_key(x) for x in preferred]
              edited = base.copy()
              regions: list[dict[str, object]] = []
              metadata: list[dict[str, object]] = []
              accepted: list[dict[str, object]] = []
              used: set[tuple[int, int, int, int]] = set()
              diag = math.hypot(*base.size)
              need = diag * min_spread
              attempted = 0
          '''
          if old_create not in text:
              raise SystemExit("Guaranteed fallback patch failed: create_pair_grouped block changed")
          text = text.replace(old_create, new_create, 1)

          marker = '''def patch_manifest_quality_diversity() -> None:
          '''
          if marker not in text:
              raise SystemExit("Guaranteed fallback patch failed: manifest marker changed")

          emergency_block = r'''
          def _final_regeneration_active() -> bool:
              provider_meta = getattr(strict, "_LAST_PROVIDER_META", None) or {}
              regen_attempt = int(provider_meta.get("scene_regeneration_attempt", 0) or 0)
              return strict.SCENE_REGEN_RETRIES > 0 and regen_attempt >= strict.SCENE_REGEN_RETRIES


          def _emergency_candidate_pool(image: Image.Image) -> list[dict[str, object]]:
              raw = cpuopt._ORIGINAL_DETECT(image)
              rows: list[dict[str, object]] = []
              for item in raw:
                  row = dict(item)
                  category = str(row.get("category", ""))
                  if category not in strict.CATEGORY_RULES:
                      continue
                  if not all(key in row for key in ("mask", "bbox", "center")):
                      continue
                  try:
                      _, meta = cpuopt._candidate_preflight(image, row)
                  except Exception as exc:
                      meta = {"reason": f"emergency_preflight:{exc}", "score": 0.0}
                  row["render_preflight"] = meta
                  row["renderability_score"] = float(meta.get("score", 0.0))
                  row["quality"] = float(row.get("quality", 0.0)) + row["renderability_score"] * 1.8
                  row["emergency_backfill"] = True
                  rows.append(row)

              rows.sort(
                  key=lambda x: (
                      float(x.get("renderability_score", 0.0)),
                      float(x.get("quality", 0.0)),
                      float(x.get("category_confidence", 0.0)),
                  ),
                  reverse=True,
              )
              if len(rows) < 3:
                  raise RuntimeError(
                      f"Emergency final-scene backfill found only {len(rows)}/3 isolated semantic objects"
                  )
              print(
                  "[emergency] backfilled final-scene candidates:",
                  [(x.get("category"), round(float(x.get("renderability_score", 0.0)), 2)) for x in rows[:12]],
              )
              return rows[: cpuopt.PREFILTER_POOL_LIMIT]


          def detect_group_ready_candidates(image: Image.Image) -> list[dict[str, object]]:
              try:
                  candidates = cpuopt.detect_prefiltered_candidates(image)
              except RuntimeError as exc:
                  if not _final_regeneration_active():
                      raise
                  print(f"[emergency] renderability prefilter exhausted on final scene: {exc}")
                  candidates = _emergency_candidate_pool(image)

              structural_count = 0
              for item in candidates:
                  structural = (
                      str(item.get("category", "")) in scene.SPECIAL
                      and float(item.get("renderability_score", 0.0)) >= cpuopt.PREFILTER_STRUCTURAL_MIN
                  )
                  item["structural_capable"] = structural
                  if structural:
                      structural_count += 1

              if structural_count < 1:
                  if not _final_regeneration_active() or not candidates:
                      raise RuntimeError(
                          "No high-confidence structural-detail candidate survived prefilter; regenerate before Diffusers"
                      )
                  promoted = max(
                      candidates,
                      key=lambda x: (
                          float(x.get("renderability_score", 0.0)),
                          float(x.get("quality", 0.0)),
                      ),
                  )
                  promoted["structural_capable"] = True
                  promoted["emergency_structural_promoted"] = True
                  print(
                      f"[emergency] promoted structural candidate: {promoted.get('category')} "
                      f"render={float(promoted.get('renderability_score', 0.0)):.2f}"
                  )

              print(
                  "[diversity] structural-ready:",
                  [
                      (x.get("category"), round(float(x.get("renderability_score", 0.0)), 2))
                      for x in candidates
                      if x.get("structural_capable")
                  ],
              )
              return candidates


          def _best_grouped_triplet(
              candidates: list[dict[str, object]],
              size: tuple[int, int],
              min_spread: float | None,
          ):
              diag = math.hypot(*size)
              need = 0.0 if min_spread is None else diag * min_spread
              structural = [x for x in candidates if x.get("structural_capable")]
              best = None
              best_score = -1e18

              for s in structural:
                  others = [x for x in candidates if x is not s]
                  for a, b in combinations(others, 2):
                      ds = [_distance(a, b), _distance(a, s), _distance(b, s)]
                      if min(ds) < need:
                          continue

                      def pattern_surface(x):
                          meta = x.get("render_preflight") or {}
                          return (
                              float(meta.get("interior_ratio", 0.0)) * 2.0
                              + float(meta.get("fill", 0.0))
                              + float(x.get("renderability_score", 0.0)) * 0.15
                          )

                      if pattern_surface(a) >= pattern_surface(b):
                          color, pattern = b, a
                      else:
                          color, pattern = a, b

                      spread_score = (min(ds) / diag) * 13.0 + (sum(ds) / (3.0 * diag)) * 7.0
                      render_score = sum(
                          float(x.get("renderability_score", 0.0)) for x in (color, pattern, s)
                      ) * 0.65
                      category_bonus = len(
                          {str(color.get("category")), str(pattern.get("category")), str(s.get("category"))}
                      ) * 0.45
                      score = spread_score + render_score + category_bonus
                      if score > best_score:
                          best_score = score
                          best = [color, pattern, s]

              if best is None:
                  if min_spread is None:
                      raise RuntimeError("No distinct color/pattern/structural triplet exists even without a spread floor")
                  raise RuntimeError(
                      f"No color/pattern/structural triplet satisfies {min_spread:.2f} image-diagonal spread"
                  )
              return best


          _NORMAL_GROUPED_PLAN = grouped_plan


          def grouped_plan(image: Image.Image, target: dict[str, object], seed: int) -> dict[str, object]:
              if not target.get("emergency_structural_promoted"):
                  return _NORMAL_GROUPED_PLAN(image, target, seed)

              category = str(target["category"])
              rule = strict.CATEGORY_RULES[category]
              return {
                  "category": category,
                  "category_label": rule["object"],
                  "classifier_confidence": target.get("category_confidence", 0.0),
                  "edit_type": "single_structural_detail",
                  "difference_group": "structural",
                  "target_part": "outer silhouette",
                  "value": "small local contour change",
                  "color_distance": 0.0,
                  "prompt": (
                      f"One isolated {rule['object']}. Make one small clean local contour change only on the masked "
                      "outer silhouette while preserving the object's identity and overall footprint. Keep background, "
                      "neighbors, position and all other parts unchanged. No extra object, text, blob or blur."
                  ),
                  "emergency_structural": True,
              }


          def _emergency_direct_edit(
              image: Image.Image,
              target: dict[str, object],
              seed: int,
              number: int,
          ):
              del seed
              slot = max(1, min(3, int(target.get("difference_slot", number))))
              group = str(target.get("required_difference_group") or ("color", "pattern", "structural")[slot - 1])
              category = str(target["category"])
              rule = strict.CATEGORY_RULES[category]
              x0, y0, x1, y1 = map(int, target["bbox"])
              x0 = max(0, min(image.width - 1, x0))
              y0 = max(0, min(image.height - 1, y0))
              x1 = max(x0 + 1, min(image.width, x1))
              y1 = max(y0 + 1, min(image.height, y1))

              crop = image.crop((x0, y0, x1, y1)).convert("RGB")
              before = np.asarray(crop, dtype=np.uint8).copy()
              after = before.copy()
              mask_full = np.asarray(target["mask"], dtype=np.uint8)
              inside = mask_full[y0:y1, x0:x1] > 0
              if not np.any(inside):
                  raise RuntimeError("Emergency deterministic edit received an empty object mask")

              mean = before[inside].mean(axis=0)
              palette = np.asarray(
                  [(235, 45, 45), (35, 210, 225), (245, 210, 35), (55, 75, 235), (45, 205, 80), (220, 55, 210)],
                  dtype=np.float32,
              )
              target_rgb = palette[int(np.argmax(np.linalg.norm(palette - mean[None, :], axis=1)))]

              if group == "color":
                  mixed = before.astype(np.float32)
                  mixed[inside] = mixed[inside] * 0.12 + target_rgb * 0.88
                  after = np.clip(mixed, 0, 255).astype(np.uint8)
                  edit_type = "full_recolor"
                  target_part = str(rule.get("target", "main surface"))
                  value = "deterministic high-contrast recolor"
              elif group == "pattern":
                  ys, _ = np.where(inside)
                  lo = int(np.quantile(ys, 0.32))
                  hi = int(np.quantile(ys, 0.68))
                  yy = np.arange(after.shape[0])[:, None]
                  band = inside & (yy >= lo) & (yy <= hi)
                  if int(np.count_nonzero(band)) < max(8, int(np.count_nonzero(inside) * 0.12)):
                      band = inside & ((yy % max(4, after.shape[0] // 4)) < max(2, after.shape[0] // 8))
                  mixed = after.astype(np.float32)
                  mixed[band] = mixed[band] * 0.10 + target_rgb * 0.90
                  after = np.clip(mixed, 0, 255).astype(np.uint8)
                  edit_type = "broad_horizontal_stripe"
                  target_part = str(rule.get("target", "main surface"))
                  value = "deterministic broad stripe"
              else:
                  local = inside.astype(np.uint8)
                  eroded = cv2.erode(local, np.ones((3, 3), np.uint8), iterations=1) > 0
                  boundary = inside & ~eroded
                  by, bx = np.where(boundary)
                  if len(bx) == 0:
                      by, bx = np.where(inside)
                  pick = int(np.argmax(bx))
                  cy, cx = int(by[pick]), int(bx[pick])
                  radius = max(4, int(math.sqrt(np.count_nonzero(inside) * 0.16 / math.pi)))
                  gy, gx = np.ogrid[:after.shape[0], :after.shape[1]]
                  notch = ((gx - cx) ** 2 + (gy - cy) ** 2 <= radius ** 2) & inside
                  outside = ~inside
                  if np.any(outside):
                      fill_rgb = before[outside].mean(axis=0)
                  else:
                      fill_rgb = 255.0 - mean
                  mixed = after.astype(np.float32)
                  mixed[notch] = mixed[notch] * 0.05 + fill_rgb * 0.95
                  after = np.clip(mixed, 0, 255).astype(np.uint8)
                  edit_type = "single_structural_detail"
                  target_part = "outer silhouette"
                  value = "deterministic local contour notch"

              changed = (np.mean(np.abs(after.astype(np.int16) - before.astype(np.int16)), axis=2) > 8) & inside
              cyy, cxx = np.where(changed)
              if len(cxx) == 0:
                  raise RuntimeError("Emergency deterministic edit produced no visible changed pixels")

              mask_local = (inside.astype(np.uint8) * 255)
              pixel = core.inpaint_qa(before, after, mask_local)
              pixel["changed_bbox"] = [
                  int(cxx.min()) + x0,
                  int(cyy.min()) + y0,
                  int(cxx.max()) + 1 + x0,
                  int(cyy.max()) + 1 + y0,
              ]
              clean = clean_difference_qa_typed(before, after, mask_local, edit_type)
              structure = strict.structure_qa(before, after, mask_local)

              candidate = image.copy()
              candidate.paste(Image.fromarray(after, "RGB"), (x0, y0))
              try:
                  semantic_qa = strict.semantic_qa(
                      candidate,
                      target,
                      max(1e-6, float(target.get("category_confidence", 0.0))),
                  )
              except Exception as exc:
                  semantic_qa = {"passed": False, "reason": str(exc)}
              semantic_qa = dict(semantic_qa)
              semantic_qa["advisory_only"] = True

              visual_ok = bool(pixel.get("passed")) and bool(clean.get("passed")) and bool(structure.get("passed"))
              if not visual_ok:
                  print(
                      f"[emergency] deterministic {group} QA override: "
                      f"pixel={pixel.get('passed')} clean={clean.get('passed')} structure={structure.get('passed')}"
                  )

              plan = {
                  "category": category,
                  "category_label": rule["object"],
                  "classifier_confidence": target.get("category_confidence", 0.0),
                  "edit_type": edit_type,
                  "difference_group": group,
                  "target_part": target_part,
                  "value": value,
                  "color_distance": 0.0,
                  "prompt": "deterministic emergency completion",
                  "emergency_mode": True,
              }
              return candidate, {
                  "backend": "deterministic-emergency",
                  "model": "none",
                  "attempt": 1,
                  "closed_set_plan": plan,
                  "single_object": True,
                  "mask_refinement": target.get("mask_refinement"),
                  "raw_single_object": target.get("raw_single_object"),
                  "refined_single_object": target.get("refined_single_object"),
                  "object_filter": target.get("object_filter"),
                  "crop": [x0, y0, x1, y1],
                  "pixel_qa": pixel,
                  "clean_difference_qa": clean,
                  "structure_qa": structure,
                  "semantic_qa": semantic_qa,
                  "emergency_mode": True,
                  "emergency_qa_override": not visual_ok,
              }


          _NORMAL_TYPED_EDIT = diffusers_edit_closed_set_typed


          def diffusers_edit_closed_set_typed(
              image: Image.Image,
              target: dict[str, object],
              seed: int,
              number: int,
          ):
              if target.get("emergency_mode"):
                  print(
                      f"[emergency] deterministic completion edit {number}: "
                      f"group={target.get('required_difference_group')} category={target.get('category')}"
                  )
                  return _emergency_direct_edit(image, target, seed, number)
              return _NORMAL_TYPED_EDIT(image, target, seed, number)


          def create_pair_grouped(base: Image.Image, seed: int):
              """Accept color/pattern/structural; hard-complete the final scene after 0.19 fails."""
              candidates = detect_group_ready_candidates(base)
              final_regen = _final_regeneration_active()
              spread_levels = [scene.MIN_SPREAD]
              if final_regen:
                  for fallback_spread in (0.21, 0.19):
                      if fallback_spread < spread_levels[-1]:
                          spread_levels.append(fallback_spread)

              last_spread_error = None
              preferred = None
              min_spread = scene.MIN_SPREAD
              emergency_mode = False
              for candidate_spread in spread_levels:
                  try:
                      preferred = _best_grouped_triplet(candidates, base.size, candidate_spread)
                  except RuntimeError as exc:
                      last_spread_error = exc
                      if candidate_spread != spread_levels[-1]:
                          print(
                              f"[diversity] final-scene spread {candidate_spread:.2f} unavailable; "
                              f"trying {spread_levels[spread_levels.index(candidate_spread) + 1]:.2f}"
                          )
                      continue
                  min_spread = candidate_spread
                  if min_spread < scene.MIN_SPREAD:
                      print(
                          f"[diversity] final-scene spread fallback active: "
                          f"{scene.MIN_SPREAD:.2f} -> {min_spread:.2f}"
                      )
                  break

              if preferred is None:
                  if not final_regen:
                      raise last_spread_error or RuntimeError("No valid grouped triplet")
                  preferred = _best_grouped_triplet(candidates, base.size, None)
                  emergency_mode = True
                  min_spread = 0.0
                  diag = math.hypot(*base.size)
                  achieved = min(
                      _distance(preferred[0], preferred[1]),
                      _distance(preferred[0], preferred[2]),
                      _distance(preferred[1], preferred[2]),
                  ) / max(1.0, diag)
                  print(
                      f"[emergency] 0.19 unavailable; guaranteed completion active. "
                      f"best available min spread={achieved:.3f}"
                  )

              preferred_keys = [_key(x) for x in preferred]
              edited = base.copy()
              regions: list[dict[str, object]] = []
              metadata: list[dict[str, object]] = []
              accepted: list[dict[str, object]] = []
              used: set[tuple[int, int, int, int]] = set()
              diag = math.hypot(*base.size)
              need = diag * min_spread
              attempted = 0

              for slot, group in ((1, "color"), (2, "pattern"), (3, "structural")):
                  while len(accepted) < slot and attempted < core.MAX_INPAINT_CANDIDATES:
                      eligible = []
                      for item in candidates:
                          item_key = _key(item)
                          if item_key in used:
                              continue
                          if group == "structural" and not item.get("structural_capable"):
                              continue
                          if not _far_from_all(item, accepted, need):
                              continue

                          if group != "structural":
                              excluded = set(used)
                              excluded.add(item_key)
                              if group == "color":
                                  has_path = False
                                  for p in candidates:
                                      pk = _key(p)
                                      if pk in excluded or pk == item_key:
                                          continue
                                      if _distance(item, p) < need:
                                          continue
                                      excluded2 = set(excluded)
                                      excluded2.add(pk)
                                      if _has_structural_completion(candidates, [item, p], need, excluded2):
                                          has_path = True
                                          break
                                  if not has_path:
                                      continue
                              elif not _has_structural_completion(candidates, accepted + [item], need, excluded):
                                  continue

                          preferred_bonus = 2.2 if item_key == preferred_keys[slot - 1] else 0.0
                          surface = item.get("render_preflight") or {}
                          surface_bonus = 0.0
                          if group == "pattern":
                              surface_bonus = (
                                  float(surface.get("interior_ratio", 0.0)) * 1.8
                                  + float(surface.get("fill", 0.0)) * 0.8
                              )
                          priority = (
                              float(item.get("renderability_score", 0.0)) * 2.3
                              + float(item.get("quality", 0.0)) * 0.07
                              + preferred_bonus
                              + surface_bonus
                          )
                          if accepted:
                              priority += min(_distance(item, old) for old in accepted) / diag * 6.5
                          else:
                              priority += float(item.get("noncentral_score", 0.0)) * 2.0
                          eligible.append((priority, item))

                      if not eligible:
                          raise RuntimeError(
                              f"No remaining {group} candidate can preserve the required three-group plan"
                          )

                      eligible.sort(key=lambda pair: pair[0], reverse=True)
                      original = eligible[0][1]
                      used.add(_key(original))
                      attempted += 1
                      item = dict(original)
                      item["difference_slot"] = slot
                      item["required_difference_group"] = group
                      item["emergency_mode"] = bool(
                          emergency_mode or item.get("emergency_structural_promoted")
                      )
                      print(
                          f"[diversity] inpaint candidate {attempted}: slot={slot} group={group} "
                          f"category={item.get('category')} render={item.get('renderability_score', 0):.2f} "
                          f"bbox={item.get('bbox')} emergency={item.get('emergency_mode')}"
                      )

                      try:
                          candidate, meta = strict.diffusers_edit_closed_set(
                              edited,
                              item,
                              seed + slot * 104729 + attempted * 4099,
                              slot,
                          )
                      except RuntimeError as exc:
                          print(
                              f"[diversity] {group} candidate rejected "
                              f"({attempted}/{core.MAX_INPAINT_CANDIDATES}): {exc}"
                          )
                          continue

                      plan = meta["closed_set_plan"]
                      actual_group = str(plan.get("difference_group", _edit_group(str(plan["edit_type"]))))
                      if actual_group != group:
                          raise RuntimeError(
                              f"Accepted edit violated diversity invariant: required={group} actual={actual_group}"
                          )

                      x0, y0, x1, y1 = map(int, meta["pixel_qa"]["changed_bbox"])
                      rx, ry = (x0 + x1) // 2, (y0 + y1) // 2
                      radius = max(18, int(math.hypot(x1 - x0, y1 - y0) * 0.54))
                      edited = candidate
                      accepted.append(item)
                      metadata.append(meta)
                      regions.append(
                          {
                              "number": slot,
                              "x": rx,
                              "y": ry,
                              "r": radius,
                              "bbox": list(item["bbox"]),
                              "changed_bbox": [x0, y0, x1, y1],
                              "area_ratio": round(float(item["ratio"]), 5),
                              "category": item["category"],
                              "edit_type": plan["edit_type"],
                              "difference_group": group,
                              "target_part": plan["target_part"],
                              "single_object": True,
                              "noncentral": True,
                              "renderability_score": round(float(item.get("renderability_score", 0.0)), 4),
                              "emergency_mode": bool(item.get("emergency_mode")),
                          }
                      )

              if len(regions) != 3:
                  raise RuntimeError(
                      f"Only {len(regions)}/3 grouped single-object differences passed after {attempted} candidates"
                  )
              groups = [str(x["difference_group"]) for x in regions]
              if groups != ["color", "pattern", "structural"]:
                  raise RuntimeError(f"Difference group invariant failed at finalization: {groups}")
              return edited, regions, metadata


          '''
          text = text.replace(marker, emergency_block + marker, 1)

          path.write_text(text, encoding="utf-8")
          print("Applied final-scene fallback: 0.23 -> 0.21 -> 0.19 -> guaranteed deterministic completion")
          PYCODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public controls
        run: |
          for pair in "DF_GAME_COUNT=$DF_GAME_COUNT" "SEQ_BASE_RUN=$SEQ_BASE_RUN" "TITLE_START=$TITLE_START"; do
            value="${pair#*=}"
            name="${pair%%=*}"
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "$name must be a positive integer; got: $value"
              exit 1
            fi
          done
          if ! [[ "$CPU_DREAMSHAPER_STEPS" =~ ^(7|8)$ ]]; then
            echo "CPU_DREAMSHAPER_STEPS must be 7 or 8; got: $CPU_DREAMSHAPER_STEPS"
            exit 1
          fi
          if ! [[ "$YT_PRIVACY_STATUS" =~ ^(private|public|unlisted)$ ]]; then
            echo "YT_PRIVACY_STATUS must be private, public or unlisted; got: $YT_PRIVACY_STATUS"
            exit 1
          fi
          echo "games=$DF_GAME_COUNT cpu_steps=$CPU_DREAMSHAPER_STEPS run_base=$SEQ_BASE_RUN title_start=$TITLE_START prompt_mode=automatic-next-unused youtube=$YT_PRIVACY_STATUS"

      - name: Validate private source, public catalogs and upload settings
        run: |
          python - <<'PYCODE'
          import ast
          import os
          from pathlib import Path

          files = (
              'difference_forge_cf.py', 'video_presentation.py', 'closed_set_runner.py',
              'siglip_florence_runner.py', 'advanced_runner.py', 'scene_intelligence_runner.py',
              'cpu_optimized_runner.py', 'quality_diversity_runner.py',
              'vision_upgrade_runner.py', 'vision_upgrade_hotfix_runner.py',
              'privacy_control_runner.py', 'sequence_control_runner.py', 'prompt_catalog_v2.py',
          )
          for name in files:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit('Missing private source file: ' + name)
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=name)
              except SyntaxError:
                  raise SystemExit('Python syntax check failed: ' + name) from None

          for name in ('requirements.txt', 'prompt.txt', 'tieude.txt', 'mota.txt',
                       'assets/fonts/ipaexg.ttf', 'assets/mascot/fox-sheet.webp',
                       'assets/tutorial/guide-A.webp', 'assets/tutorial/guide-B.webp',
                       'assets/tutorial/differences.json', 'assets/presentation/brain-orbit.webp'):
              if not Path(name).is_file():
                  raise SystemExit('Missing private runtime input or asset: ' + name)

          control = Path(os.environ['RUNNER_CONTROL_DIR'])
          for name in ('extra-titles.txt', 'extra-prompts.txt', 'mota.txt',
                       'title-usage.txt', 'prompt-usage.txt'):
              if not (control / name).is_file():
                  raise SystemExit('Missing public control file: ' + name)

          def active_lines(path):
              return [
                  line.strip() for line in path.read_text(encoding='utf-8').splitlines()
                  if line.strip() and not line.lstrip().startswith('#')
              ]

          titles = active_lines(control / 'extra-titles.txt')
          prompts = active_lines(control / 'extra-prompts.txt')
          if len(titles) < 300:
              raise SystemExit(f'extra-titles.txt must contain at least 300 titles; got {len(titles)}')
          if len(prompts) < 600:
              raise SystemExit(f'extra-prompts.txt must contain at least 600 prompts; got {len(prompts)}')
          if not (control / 'mota.txt').read_text(encoding='utf-8').strip():
              raise SystemExit('Public mota.txt is empty')

          if os.getenv('YT_UPLOAD_ENABLED', '').lower() == 'true':
              missing = [name for name in ('YT_CLIENT_ID', 'YT_CLIENT_SECRET', 'YT_REFRESH_TOKEN')
                         if not os.getenv(name, '').strip()]
              if missing:
                  raise SystemExit('Add Actions secrets to this public repository: ' + ', '.join(missing))
          print(f'Public catalogs ready: titles={len(titles)} prompts={len(prompts)}; public mota.txt active.')
          PYCODE

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk libgl1
          python -m pip install --upgrade pip
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
            python -m pip install torch torchvision
          else
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt
          python -m py_compile difference_forge_cf.py video_presentation.py closed_set_runner.py siglip_florence_runner.py advanced_runner.py scene_intelligence_runner.py cpu_optimized_runner.py quality_diversity_runner.py vision_upgrade_runner.py vision_upgrade_hotfix_runner.py privacy_control_runner.py sequence_control_runner.py prompt_catalog_v2.py

      - name: Generate and upload
        run: python sequence_control_runner.py

      - name: Commit updated title and prompt usage
        working-directory: runner-control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add title-usage.txt prompt-usage.txt
          if git diff --cached --quiet; then
            echo "No usage-state changes to commit."
            exit 0
          fi
          git commit -m "Update title and prompt usage [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
